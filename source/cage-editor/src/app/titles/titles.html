<main class="content-panel">
  <section class="content-section">
    <div class="section-header">
      <h2>Titles</h2>
    </div>

    @if (isLoading()) {
    <div class="loading-state" aria-live="polite">
      <mat-progress-spinner mode="indeterminate" diameter="28"></mat-progress-spinner>
      <span>Loading titles...</span>
    </div>
    } @else {
    <ul class="item-list">
      @for (title of titles(); track title.id) {
        <li class="item-list-item">
          {{ title.name }}
          <div class="form-actions">
            <button
              mat-icon-button
              type="button"
              [routerLink]="['/organizations', organizationId(), 'titles', title.id, 'edit']"
              [attr.aria-label]="'Edit title ' + title.name"
            >
              <mat-icon aria-hidden="true">edit</mat-icon>
            </button>
            <button
              mat-icon-button
              type="button"
              (click)="deleteTitle(title.id, title.name)"
              [disabled]="isDeleting()"
              [attr.aria-label]="'Delete title ' + title.name"
            >
              <mat-icon aria-hidden="true">delete</mat-icon>
            </button>
          </div>
        </li>
      }
    </ul>

    <div class="form-actions">
      <button mat-button type="button" routerLink="/">Back</button>
      <button mat-button type="button" [routerLink]="['/organizations', organizationId(), 'titles', 'new']" [disabled]="titles().length >= 100">
        New title
      </button>
      @if (titles().length >= 100) {
      <span>Maximum of 100 titles reached.</span>
      }
    </div>
    }
  </section>
</main>
