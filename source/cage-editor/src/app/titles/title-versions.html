<main class="content-panel">
  <section class="content-section">
    <div class="section-header">
      <h2>Title versions</h2>
    </div>

    @if (isLoading()) {
      <div class="loading-state" aria-live="polite">
        <mat-progress-spinner mode="indeterminate" diameter="28"></mat-progress-spinner>
        <span>Loading title versions...</span>
      </div>
    } @else {
      <table class="title-version-table">
        <thead>
          <tr>
            <th scope="col" aria-label="Read-only status"></th>
            <th scope="col">Version name</th>
            <th scope="col">Actions</th>
          </tr>
        </thead>
        <tbody>
          @for (version of versions(); track version.id) {
            <tr>
              <td>
                @if (version.isReadOnly) {
                  <mat-icon aria-label="Read-only">lock</mat-icon>
                }
              </td>
              <td>
                <a
                  [routerLink]="[
                    '/organizations',
                    organizationId(),
                    'titles',
                    titleId(),
                    'versions',
                    version.id,
                    'attributes',
                  ]"
                >
                  {{ version.name }}
                </a>
              </td>
              <td>
                <div class="version-actions">
                  <button
                    mat-icon-button
                    type="button"
                    [routerLink]="[
                      '/organizations',
                      organizationId(),
                      'titles',
                      titleId(),
                      'versions',
                      version.id,
                      'edit',
                    ]"
                    [attr.aria-label]="'Rename version ' + version.name"
                  >
                    <mat-icon aria-hidden="true">edit</mat-icon>
                  </button>
                  <button
                    mat-icon-button
                    type="button"
                    (click)="setReadOnly(version)"
                    [disabled]="isSubmitting()"
                    [attr.aria-label]="
                      (version.isReadOnly ? 'Unlock' : 'Lock') + ' version ' + version.name
                    "
                  >
                    <mat-icon aria-hidden="true">{{
                      version.isReadOnly ? 'lock_open' : 'lock'
                    }}</mat-icon>
                  </button>
                  <button
                    mat-icon-button
                    type="button"
                    (click)="deleteVersion(version)"
                    [disabled]="isSubmitting()"
                    [attr.aria-label]="'Delete version ' + version.name"
                  >
                    <mat-icon aria-hidden="true">delete</mat-icon>
                  </button>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>

      <div class="form-actions">
        <button
          mat-button
          type="button"
          [routerLink]="['/organizations', organizationId(), 'titles']"
        >
          Back to titles
        </button>
        <button
          mat-button
          type="button"
          [routerLink]="[
            '/organizations',
            organizationId(),
            'titles',
            titleId(),
            'versions',
            'new',
          ]"
          [disabled]="versions().length >= maximumVersions"
        >
          New version
        </button>
        @if (versions().length >= maximumVersions) {
          <span>Maximum of {{ maximumVersions }} versions reached.</span>
        }
      </div>
    }
  </section>
</main>
