<header class="home-header">
  <a class="home-button" mat-icon-button routerLink="/" aria-label="Home">
    <mat-icon aria-hidden="true">home</mat-icon>
  </a>

  @if (organizationId(); as organizationId) {
  <nav class="breadcrumb" aria-label="Breadcrumb">
    <ol>
      <li><a [routerLink]="['/organizations', organizationId, 'titles']">{{ organizationName() }}</a></li>
      @if (activeTitleId(); as titleId) {
      <li>
        <a [routerLink]="['/organizations', organizationId, 'titles', titleId, 'attributes']">{{ titleName() }}</a>
      </li>
      }
    </ol>
  </nav>
  }

  <nav class="feature-buttons" aria-label="Title features">
    @if (organizationId(); as organizationId) {
    @if (activeTitleId(); as titleId) {
    <a mat-button [routerLink]="['/organizations', organizationId, 'titles', titleId, 'attributes']">
      Attributes
    </a>
    }
    }
  </nav>

  <div class="user-menu">
    <div class="user-info">
      <mat-icon aria-hidden="true">account_circle</mat-icon>
      <span>{{ userName() }}</span>
    </div>

    <button class="sign-out-link" mat-button type="button" (click)="signOut()">
      <mat-icon aria-hidden="true">logout</mat-icon>
      <span>Sign Out</span>
    </button>
  </div>
</header>

<router-outlet />
