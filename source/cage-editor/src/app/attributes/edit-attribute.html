<main class="content-panel">
  <section class="content-section">
    <div class="section-header">
      <h2>Edit attribute</h2>
    </div>

    @if (isLoading()) {
    <div class="loading-state" aria-live="polite">
      <mat-progress-spinner mode="indeterminate" diameter="28"></mat-progress-spinner>
      <span>Loading attribute...</span>
    </div>
    } @else if (notFound()) {
    <p class="field-error" role="alert">Attribute not found.</p>
    <div class="form-actions">
      <button mat-button type="button" [routerLink]="['/organizations', organizationId(), 'titles', titleId(), 'attributes']">Back</button>
    </div>
    } @else {
    <form (submit)="updateAttribute(); $event.preventDefault()" novalidate>
      <label for="attribute-name">Attribute name</label>
      <input id="attribute-name" class="text-input" type="text" [formField]="attributeForm.name" autocomplete="off" />
      @if (attributeForm.name().touched() && attributeForm.name().invalid()) {
      <p class="field-error" role="alert">Enter an attribute name of at most 50 characters.</p>
      }

      <label for="attribute-type">Attribute type</label>
      <select id="attribute-type" class="text-input" [formField]="attributeForm.type">
        @for (type of attributeTypes; track type) {
        <option [value]="type">{{ type }}</option>
        }
      </select>

      <div class="form-actions">
        <button mat-button type="button" [routerLink]="['/organizations', organizationId(), 'titles', titleId(), 'attributes']">Cancel</button>
        <button mat-button type="submit" [disabled]="isSubmitting()">
          {{ isSubmitting() ? 'Saving...' : 'Save attribute' }}
        </button>
      </div>
    </form>
    }
  </section>
</main>
