@if (isLoading()) {
  <div class="loading-state" aria-live="polite">
    <mat-progress-spinner mode="indeterminate" diameter="28"></mat-progress-spinner>
    <span>Loading card...</span>
  </div>
} @else if (notFound()) {
  <p class="field-error" role="alert">Card not found.</p>
} @else {
  <form (submit)="updateCard(); $event.preventDefault()" novalidate>
    <fieldset [disabled]="disabled() || isReadOnly() || isSubmitting()">
        <app-entity-values-editor
          [attributes]="attributes()"
          [tags]="tags()"
          [inheritedAttributes]="inheritedValues().attributes"
          [inheritedTags]="inheritedValues().tags"
          [attributeValues]="model().attributeValues"
          (attributeValuesChange)="setAttributeValues($event)"
          [tagIds]="model().tagIds"
          (tagIdsChange)="setTagIds($event)"
        />
    </fieldset>
    @if (errorMessage()) {
      <p class="field-error" role="alert">{{ errorMessage() }}</p>
    }
    @if (!isReadOnly()) {
      <div class="form-actions">
        <button mat-button type="submit" [disabled]="disabled() || isSubmitting() || !cardTypes().length">
          {{ isSubmitting() ? 'Saving...' : 'Save card' }}
        </button>
      </div>
    }
  </form>
}
