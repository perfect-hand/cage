@if (authService.isSignedIn()) {
    <p>Welcome {{ authService.userName() }}!</p>
    <button matButton="elevated" (click)="sendRequest()">Send Request</button>
    <button matButton="elevated" (click)="authService.signOut()">Sign Out</button>
} @else {
    <button matButton="elevated" (click)="authService.signIn()">Sign In</button>
}
