<main class="content-panel">
  <section class="content-section">
    <div class="section-header">
      <h2>Organizations</h2>
    </div>

    @if (isLoading()) {
    <div class="loading-state" aria-live="polite">
      <mat-progress-spinner mode="indeterminate" diameter="28"></mat-progress-spinner>
      <span>Loading organizations...</span>
    </div>
    } @else {
    <ul class="item-list">
    @for (organization of organizations(); track organization.id) {
    <li class="item-list-item">
      <a [routerLink]="['/organizations', organization.id, 'titles']">{{ organization.name }}</a>
      <div class="form-actions">
        <button
          mat-icon-button
          type="button"
          [routerLink]="['/organizations', organization.id, 'edit']"
          [attr.aria-label]="'Edit organization ' + organization.name"
        >
          <mat-icon aria-hidden="true">edit</mat-icon>
        </button>
        <button
          mat-icon-button
          type="button"
          (click)="deleteOrganization(organization.id, organization.name)"
          [disabled]="isDeleting()"
          [attr.aria-label]="'Delete organization ' + organization.name"
        >
          <mat-icon aria-hidden="true">delete</mat-icon>
        </button>
      </div>
    </li>
    }
    </ul>

    <div class="form-actions">
      <button mat-button type="button" routerLink="/organizations/new" [disabled]="organizations().length >= 10">
        New organization
      </button>
      @if (organizations().length >= 10) {
      <span>Maximum of 10 organizations reached.</span>
      }
    </div>
    }
  </section>
</main>
