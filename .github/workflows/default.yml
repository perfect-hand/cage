name: default

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # https://github.com/actions/checkout
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # https://github.com/actions/setup-dotnet
      - name: Setup dotnet 10.0.x
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
    
      # https://docs.github.com/en/actions/how-tos/write-workflows/choose-what-workflows-do/add-scripts
      # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idstepsshell
      - name: Show debug info
        shell: pwsh
        run: ./build/ShowDebugInfo.ps1

      - name: Build simulation library
        shell: pwsh
        run: ./build/BuildSimulation.ps1

      - name: Build editor backend
        shell: pwsh
        run: ./build/BuildEditorBackend.ps1
        env:
          # https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#github-context
          GITHUB_USER: ${{ github.actor }}
          # https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#secrets-context
          # Secrets in GitHub must not being with GITHUB_ ...
          GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB_PACKAGES }}

      - name: Build game backend
        shell: pwsh
        run: ./build/BuildGameBackend.ps1
        env:
          # https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#github-context
          GITHUB_USER: ${{ github.actor }}
          # https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#secrets-context
          # Secrets in GitHub must not being with GITHUB_ ...
          GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB_PACKAGES }}

      - name: Push Git tag
        shell: pwsh
        run: ./build/PushGitTag.ps1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Show debug info
        shell: pwsh
        run: ./build/ShowDebugInfo.ps1

      - name: Deploy editor backend
        shell: pwsh
        run: ./build/DeployEditorBackend.ps1
        env:
          AZURE_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET_AZURE }}

      - name: Deploy game backend
        shell: pwsh
        run: ./build/DeployGameBackend.ps1
        env:
          AZURE_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET_AZURE }}
